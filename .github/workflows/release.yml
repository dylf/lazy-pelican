name: Release

# On every push to main, CI runs first. Only if it passes does release-please run: it keeps a "release" pull
# request up to date (version bump in plugin.json, changelog) from conventional commit messages. Merging that PR
# creates the tag and GitHub Release (again only after CI passes), and the last job attaches the plugin zip and
# update.json to it.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release-please:
    name: Release PR
    needs: ci
    runs-on: ubuntu-latest

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  assets:
    name: Attach plugin zip
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Build the plugin zip
        run: |
          ID="$(jq -r .id plugin.json)"
          # The folder inside the zip must match the plugin id. Dev-only files are excluded via .gitattributes.
          git archive --format=zip --prefix="$ID/" -o "$ID.zip" HEAD
          echo "ID=$ID" >> "$GITHUB_ENV"

      - name: Write update.json
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          SHA256="$(sha256sum "$ID.zip" | cut -d' ' -f1)"
          jq -n \
            --arg version "${TAG#v}" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ID}.zip" \
            --arg sha256 "$SHA256" \
            '{"*": {version: $version, download_url: $url, sha256: $sha256}}' > update.json
          cat update.json

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" "$ID.zip" update.json --clobber

  agent-binaries:
    name: Agent binaries
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod

      - name: Build and package
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          VERSION="${TAG#v}"
          mkdir -p dist
          for ARCH in amd64 arm64; do
            NAME="lazy-pelican-agent_${VERSION}_linux_${ARCH}"
            mkdir -p "dist/$NAME"
            (cd agent && CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" go build -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" -o "../dist/$NAME/lazy-pelican-agent" ./cmd/lazy-pelican-agent)
            cp agent/README.md agent/deploy/* "dist/$NAME/"
            tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          done
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS && cat SHA256SUMS)

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber

  agent-image:
    name: Agent image
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Work out the image name
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          # GHCR image names must be lowercase
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lazy-pelican-agent" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: agent
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
